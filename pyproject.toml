[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dgx-spark-memory-dashboard"
version = "0.1.0"
description = "Live GiB-accurate unified-memory map for NVIDIA DGX Spark — see what's loaded, what's on disk, and what still fits."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hectorTSH" }]
keywords = ["dgx-spark", "gb10", "ollama", "vllm", "unified-memory", "dashboard", "nvidia"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
menubar = ["rumps>=0.4.0"]
all = ["PyYAML>=6.0", "rumps>=0.4.0"]

[project.scripts]
dgx-spark-memory-dashboard = "dgx_spark_memory_dashboard.server:main"

[project.urls]
Homepage = "https://github.com/hectorTSH/dgx-spark-memory-dashboard"
Issues = "https://github.com/hectorTSH/dgx-spark-memory-dashboard/issues"

[tool.setuptools.packages.find]
include = ["dgx_spark_memory_dashboard*"]

[tool.setuptools.package-data]
dgx_spark_memory_dashboard = []
